[project]
name = "siterecon"
version = "0.3.0"
description = "Modular, passive website reconnaissance CLI (DNS, network, HTTP, TLS) with JSON and Markdown reports."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "dnspython>=2.9.2",
    "httpx[http2]>=0.28.1",
    "idna>=3.20",
    "maxminddb>=2.6.2",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.28.0",
]

[project.optional-dependencies]
# Dynamic rendering (the `--render` flag). Needs a browser binary too: `uv run playwright install chromium`.
render = [
    "playwright>=1.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.14.0",
    "mypy>=1.13.0",
    "playwright>=1.48.0",
]

[project.scripts]
siterecon = "recon.cli:run"
recon = "recon.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Keep the correctness-oriented defaults (pyflakes F-codes and the like). The codebase deliberately favours
# compact one-line methods and small lambda helpers, so the purely stylistic one-liner/lambda rules are off.
ignore = ["E701", "E702", "E731"]

[tool.ruff.lint.per-file-ignores]
# Tests group imports beside the section that uses them, so some module-level imports appear mid-file.
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.13"
files = ["recon"]
# Third-party packages ship partial or no stubs; don't fail the run on their missing type information.
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Annotations are being completed incrementally; untyped defs are allowed for now rather than enforced repo-wide.
disallow_untyped_defs = false

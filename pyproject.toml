[project]
name = "siterecon"
version = "0.3.0"
description = "Modular, passive website reconnaissance CLI (DNS, network, HTTP, TLS) with JSON and Markdown reports."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "dnspython>=2.9.2",
    "httpx[http2]>=0.28.1",
    "idna>=3.20",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
]

[project.scripts]
siterecon = "recon.cli:run"
recon = "recon.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

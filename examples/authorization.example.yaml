# Example active-testing authorization file for `siterecon active`.
#
# This is a TEMPLATE. Fill it in for a system you are authorized to test, then run:
#   siterecon active <target> --authorization this-file.yaml --dry-run
# and review the plan before dropping --dry-run.
#
# The scope is authored by hand. SiteRecon never infers it from a passive scan.

target: example.com
authorized_by: "Your Name / Role"
authorized_on: "2026-11-08"

# Wall-clock window. Active testing is refused outside it (per-engagement, not a standing permission).
window:
  start: "2026-11-10T00:00:00Z"
  end: "2026-11-10T06:00:00Z"

# Engagement-wide limits (clamped: rps 0.1..5.0, budget 1..1000).
rate_limit_rps: 1.0
max_requests: 50
max_requests_per_check: 25

scope:
  hosts:                       # exact hostnames only; subdomains are not implicitly in scope
    - api.example.com
  exclude_hosts: []
  tls_authorized_hosts: []     # add a host here to allow tls_protocol_enum against it

# A check runs only if it is named here AND its configuration below is present and ready.
checks_enabled: []

# --- per-check configuration (only needed for the checks you enable) ---

# backend_read_access: "can a public, client-side credential read data it shouldn't?"
# One read-only probe per resource. Each backend has a `kind`; a private/server-side credential
# (service_role, sb_secret_, a service-account JSON, a known secret pattern) is rejected before any
# request. Add each backend's host to scope.hosts above, or the backend is skipped.
#
# backends:
#   - kind: supabase
#     host: yourref.supabase.co
#     credential: "eyJ...public-anon-key..."   # public anon key ONLY (service_role is rejected)
#     resources: [profiles, items]             # table names; one request per table, no pagination
#
#   - kind: firebase
#     project_id: my-app-1234
#     database: firestore                      # or realtime_db (scope host: my-app-1234.firebaseio.com)
#     credential: null                         # Firestore REST often needs none to test the open case
#     resources: [users, orders]               # collection names (firestore) or paths (realtime_db)
#
#   - kind: hasura
#     host: my-app.hasura.app                  # POST /v1/graphql with x-hasura-role: anonymous
#     role: anonymous
#     resources: [users, orders]               # GraphQL type/table names
#
#   - kind: pocketbase
#     base_url: "https://pb.example.com"
#     resources: [posts, comments]             # collection names
#
#   - kind: rest_generic                       # most sites: their own API with a key shipped to the client
#     base_url: "https://api.example.com"
#     credential_header: "X-Api-Key"           # or credential_param: "apikey"
#     credential: "pk_live_public..."
#     resources:
#       - path: "/v1/users?limit=1"
#         success_if: {status: 200, body_contains: "email"}   # YOU define open vs denied here
#         denied_if: {status: [401, 403]}
#
#   - kind: graphql_generic
#     url: "https://api.example.com/graphql"
#     credential_header: "Authorization"
#     credential: "Bearer public-token"
#     resources:
#       - name: me
#         query: "query { me { id } }"

